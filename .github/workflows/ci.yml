name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # This package has zero runtime or dev dependencies (no package-lock.json, nothing to
      # fetch), so there is nothing for `npm ci` to do. The step still exists, with this id, so
      # the condition below has something to read — the same shape every other workflow in this
      # workspace uses to keep a red gate from hiding the ones behind it.
      - name: install
        id: install
        run: echo "zero dependencies, nothing to install"

      # `npm test` runs the assertion suite (test/run.mjs) and then the type check.
      - name: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
